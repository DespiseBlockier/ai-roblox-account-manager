name: Linux preview build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/LocalAccountManager.Linux/**'
      - 'src/LocalAccountManager/*.cs'
      - 'scripts/Build-Linux.py'
      - 'scripts/Linux-Readme.txt'
      - 'third-party/*'
      - '.github/workflows/linux-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python3 scripts/Build-Linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: releases/*-linux-x64.tar.gz*
          compression-level: 0
          if-no-files-found: error

  startup:
    name: Start on ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:base
            distro: arch
          - name: CachyOS
            image: cachyos/cachyos:latest
            distro: arch
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            distro: suse
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release
      - name: Create and reopen an empty encrypted vault in Xvfb
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          docker run --rm -i --env DISTRO -v "$PWD/release:/release:ro" "$IMAGE" /bin/bash -se <<'CONTAINER'
          set -euo pipefail
          if [[ $DISTRO == arch ]]; then
            pacman -Syu --noconfirm --needed libx11 libice libsm libxcursor libxrandr libxext libxi libxrender libxfixes \
              fontconfig ttf-dejavu icu openssl xorg-server-xvfb xdotool tar gzip
            if [[ ! -r /usr/lib/libssl.so.3 ]]; then
              pacman -S --noconfirm --needed openssl-3
            fi
          else
            zypper --non-interactive install --no-recommends libX11-6 libICE6 libSM6 libXcursor1 libXrandr2 libXext6 \
              libXi6 libXrender1 libXfixes3 fontconfig dejavu-fonts libicu-devel libopenssl3 libz1 \
              xorg-x11-server-Xvfb xdotool tar gzip
          fi
          cd "$(mktemp -d)"
          cp /release/* .
          sha256sum -c ./*.sha256
          tar -xzf ./*.tar.gz
          cd RobloxAccountManager
          ./RobloxAccountManager --version
          app/.playwright/node/linux-x64/node --version
          export DISPLAY=:41
          ulimit -c 0
          Xvfb "$DISPLAY" -screen 0 1280x900x24 -nolisten tcp -ac </dev/null &
          xserver=$!
          manager=
          trap 'kill "$xserver" ${manager:+"$manager"} 2>/dev/null || true' EXIT
          timeout 15s bash -c 'until xdotool getdisplaygeometry >/dev/null 2>&1; do sleep 0.2; done'
          start() {
            ./RobloxAccountManager </dev/null &
            manager=$!
          }
          wait_for_window() {
            local window
            for _ in {1..100}; do
              if window=$(xdotool search --onlyvisible --name "$1" | sed -n '1p') && [[ -n $window ]]; then
                printf '%s\n' "$window"
                return 0
              fi
              if ! kill -0 "$manager" 2>/dev/null; then
                echo "Manager exited before showing $1" >&2
                wait "$manager"
                return 1
              fi
              sleep 0.25
            done
            echo "Timed out waiting for $1" >&2
            return 1
          }
          start
          unlock=$(wait_for_window '^Create your portable vault$')
          xdotool windowfocus "$unlock" type 'Smoke-Test-Only-2026'
          xdotool key Tab
          xdotool type 'Smoke-Test-Only-2026'
          xdotool key Return
          wait_for_window '^Roblox Account Manager' >/dev/null
          test "$(stat -c %a Data/accounts.vault)" = 600
          test "$(stat -c %a Data)" = 700
          kill "$manager"
          wait "$manager" || true
          start
          unlock=$(wait_for_window '^Unlock your portable vault$')
          xdotool windowfocus "$unlock" type 'Smoke-Test-Only-2026'
          xdotool key Return
          wait_for_window '^Roblox Account Manager' >/dev/null
          CONTAINER
